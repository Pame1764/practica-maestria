apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-db-push
  namespace: devops-lab
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: prisma
          image: practica-backend:1.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "npx prisma db push"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DATABASE_URL
